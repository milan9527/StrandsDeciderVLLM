[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "strands-decider-vllm"
version = "0.1.0"
description = "Strands Decider v19 Pointer Head adapter for vLLM"
requires-python = ">=3.11,<3.14"
dependencies = [
  "strands-decider @ https://github.com/strands-labs/strands-decider/archive/63d24ae286e50105fba0bd1db15b0e243aea4650.tar.gz",
  "transformers==5.17.0",
  "peft==0.21.0",
  "fastapi>=0.133,<0.137",
  "httpx>=0.28,<1",
  "uvicorn>=0.30,<1",
  "safetensors>=0.6",
]

[project.optional-dependencies]
cpu = ["torch==2.7.1"]
gpu = ["vllm==0.31.0"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.12,<1"]

[project.scripts]
decider-vllm = "decider_vllm.cli:main"

[project.entry-points."vllm.general_plugins"]
strands_decider = "decider_vllm:register"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/decider_vllm"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires local model weights", "gpu: requires vLLM and a CUDA GPU"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
